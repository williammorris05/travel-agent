[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-backend"
version = "0.1.0"
description = "Python backend for an adventure and budget travel planning demo"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.5", "pydantic-settings==2.15.0", "uvicorn==0.53.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
